name: Android APK build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK (diagnostics)
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AlisaRadio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Prefer repository secrets when configured. Otherwise restore the exact
      # signing key used by the already-published APK from its private artifact.
      - name: Restore signing key from repository secrets
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alisaradio-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/alisaradio-release.jks" >> "$GITHUB_ENV"

      - name: Download existing signing-key backup
        if: ${{ env.KEYSTORE_BASE64 == '' || env.KEYSTORE_PASSWORD == '' || env.KEY_ALIAS == '' || env.KEY_PASSWORD == '' }}
        uses: actions/download-artifact@v4
        with:
          name: AlisaRadio-signing-key-backup
          path: signing-backup
          repository: ${{ github.repository }}
          run-id: 44392999638
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore existing signing key
        if: ${{ env.KEYSTORE_BASE64 == '' || env.KEYSTORE_PASSWORD == '' || env.KEY_ALIAS == '' || env.KEY_PASSWORD == '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s signing-backup/alisaradio-release.jks
          source signing-backup/SIGNING-INFO.txt
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/signing-backup/alisaradio-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: AlisaRadio-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
